<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descargar OpoAlert</title>
<meta name="description" content="OpoAlert: convocatorias de empleo público, bolsas y oposiciones de los boletines oficiales de España. Gratis en Android e iPhone.">
<meta property="og:title" content="OpoAlert: oposiciones y empleo público">
<meta property="og:description" content="Convocatorias de más de 60 boletines oficiales en una sola app. Gratis en Android e iPhone.">
<style>
  :root { --blue:#1E4FD5; --navy:#17243C; --slate:#64748B; --bg:#F6F8FC; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--navy); }
  main { max-width:440px; margin:0 auto; padding:48px 20px; text-align:center; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--slate); line-height:1.5; }
  a.store { display:block; margin:14px 0; padding:16px; border-radius:14px; background:var(--blue); color:#fff; font-weight:600; text-decoration:none; font-size:17px; }
  a.store.ios { background:var(--navy); }
  small { display:block; margin-top:28px; color:var(--slate); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>OpoAlert</h1>
  <p>Convocatorias de empleo público, bolsas y oposiciones de más de 60 boletines oficiales de España, en una sola app.</p>
  <a class="store" id="play" href="https://play.google.com/store/apps/details?id=es.opoalert.app">Descargar en Google Play</a>
  <a class="store ios" id="ios" href="https://apps.apple.com/es/app/opoalert-oposiciones-y-empleo/id6831053083">Descargar en el App Store</a>
  <small>OpoAlert es un proyecto independiente: no es una app oficial ni pertenece a ninguna Administración.</small>
</main>
<script>
  // Cada móvil va directo a su tienda; en un ordenador se quedan los dos botones.
  var ua = navigator.userAgent || "";
  var target = /android/i.test(ua) ? "play" : (/iphone|ipad|ipod/i.test(ua) ? "ios" : null);
  if (target) location.replace(document.getElementById(target).href);
</script>
</body>
</html>
