name: OpoAlert - Auditar BOP Badajoz 30 dias
on:
  push:
    branches: [feature/extremadura-tres-fuentes-20261029]
    paths: [backend/badajoz_bop.py, .github/workflows/audit-ext-badajoz.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/badajoz_bop.py --output verified/badajoz_bop.json
      - uses: actions/upload-artifact@v4
        with:
          name: extremadura-badajoz-bop-30dias
          path: verified/badajoz_bop.json
          retention-days: 15
          if-no-files-found: error
