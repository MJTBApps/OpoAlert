          unzip -Z1 OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep 'assets/verified/PV.json'
          unzip -Z1 OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep 'assets/verified/AC.json'
