          unzip -Z1 OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep 'assets/verified/ML.json'
          sha256sum OpoAlert-Melilla-1.26.0-PRUEBA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpoAlert-APK-MELILLA-PRIVADA-1.26.0
