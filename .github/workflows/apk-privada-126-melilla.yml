          unzip -Z1 OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep 'assets/verified/IC.json'
          unzip -Z1 OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep 'assets/verified/LP.json'
