        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK de Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar selector, favoritos, alertas y fichas
        run: python scripts/test_ui_080.py
      - name: Compilar y ejecutar todas las pruebas Android
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Preparar archivo para instalacion personal
        run: |
          set -eu
          cp app/build/outputs/apk/debug/app-debug.apk OpoAlert-Melilla-1.26.0-PRUEBA.apk
          unzip -t OpoAlert-Melilla-1.26.0-PRUEBA.apk >/dev/null
          unzip -Z1 OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep 'assets/verified/MD.json'
          unzip -Z1 OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep 'assets/verified/HB.json'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep "package: name='es.opoalert.app.melilla'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging OpoAlert-Melilla-1.26.0-PRUEBA.apk | grep "OpoAlert Melilla"
