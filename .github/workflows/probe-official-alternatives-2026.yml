name: OpoAlert - Auditar accesos oficiales alternativos 2026
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/probe_2026_official_alternatives.py
      - .github/workflows/probe-official-alternatives-2026.yml
permissions:
  contents: read
jobs:
  official-alternatives:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -u backend/probe_2026_official_alternatives.py
