name: OpoAlert - Auditar Gipuzkoa BOG 30 dias
on:
  push:
    branches: [feature/pais-vasco-cantabria-asturias-20261029]
    paths: [backend/gipuzkoa_bog.py, .github/workflows/audit-gipuzkoa-bog.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/gipuzkoa_bog.py --output verified/gipuzkoa_bog.json
      - uses: actions/upload-artifact@v4
        with:
          name: norte-gipuzkoa-bog-30dias
          path: verified/gipuzkoa_bog.json
          retention-days: 30
          if-no-files-found: error
