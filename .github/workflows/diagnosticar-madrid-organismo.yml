name: OpoAlert - Examinar organismo XML Madrid
on:
  push:
    branches: [feature/madrid-bocm-20261029]
    paths: [backend/diagnosticar_madrid_organismo.py,.github/workflows/diagnosticar-madrid-organismo.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  examinar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diagnosticar_madrid_organismo.py
