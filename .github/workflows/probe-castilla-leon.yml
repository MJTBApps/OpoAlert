name: OpoAlert - Diagnostico Castilla y Leon diez boletines
on:
  push:
    branches: [feature/castilla-leon-nueve-provincias-20261029]
    paths: [backend/probe_castilla_leon.py, .github/workflows/probe-castilla-leon.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_castilla_leon.py
