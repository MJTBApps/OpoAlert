name: OpoAlert - Inspeccionar API BORM
on:
  push:
    branches: [feature/murcia-borm-20261029]
    paths: [backend/probe_murcia_services.py, .github/workflows/probe-murcia-services.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  localizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -u backend/probe_murcia_services.py
