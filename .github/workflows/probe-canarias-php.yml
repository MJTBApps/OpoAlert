name: OpoAlert - PHP portales provinciales Canarias
on:
  push:
    branches: [feature/canarias-3-boletines-20261029]
    paths: [backend/probe_canarias_php.py, .github/workflows/probe-canarias-php.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_canarias_php.py
