name: OpoAlert - Comprobar enlaces originales índice alternativo BON
on:
  workflow_dispatch:
  push:
    branches: [feature/navarra-rioja-20261029]
    paths: [backend/probe_bon_mirror.py, .github/workflows/probe-bon-mirror.yml]
permissions: {contents: read}
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/probe_bon_mirror.py
