name: OpoAlert - Auditar Jaen desde hemeroteca oficial
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [.github/workflows/cierre-jaen-audit.yml]
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -m py_compile backend/pandora_bop.py
      - run: python -u backend/pandora_bop.py --province jaen --days 30 --output out/JA.json
      - uses: actions/upload-artifact@v4
        with:
          name: jaen-30dias-auditado
          path: out/JA.json
          retention-days: 30
          if-no-files-found: error
