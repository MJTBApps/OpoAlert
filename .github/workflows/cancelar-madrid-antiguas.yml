name: OpoAlert - Cancelar auditorias Madrid obsoletas
on:
  push:
    branches: [feature/madrid-bocm-20261029]
    paths: [.github/workflows/cancelar-madrid-antiguas.yml]
permissions:
  actions: write
jobs:
  cancelar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancelar lecturas anteriores obsoletas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 40836800777 40836829320; do
            gh run cancel "$id" --repo MJTBApps/OpoAlert || true
          done
