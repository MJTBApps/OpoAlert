name: OpoAlert - Examinar anuncios excepcionales BOJA
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/probe_boja_exception.py, .github/workflows/probe-boja-exception.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_boja_exception.py
