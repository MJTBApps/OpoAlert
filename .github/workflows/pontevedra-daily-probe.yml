name: OpoAlert - Fechas directas BOP Pontevedra
on:
  push:
    branches: [feature/galicia-cinco-boletines-20261029]
    paths: [backend/pontevedra_daily_probe.py, .github/workflows/pontevedra-daily-probe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/pontevedra_daily_probe.py
