name: OpoAlert - Diagnosticar duplicados Teruel
on:
  push:
    branches: [feature/teruel-bop-audit-20261028]
    paths: ['backend/diag_teruel_13.py', '.github/workflows/diag-teruel-13.yml']
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_teruel_13.py
