name: OpoAlert - Auditar BOP Soria 30 dias
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/soria_bop.py,.github/workflows/audit-soria.yml]
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/soria_bop.py --output verified/soria_bop.json
      - uses: actions/upload-artifact@v4
        with:
          name: cyl-soria-bop-30dias
          path: verified/soria_bop.json
          retention-days: 15
          if-no-files-found: error
