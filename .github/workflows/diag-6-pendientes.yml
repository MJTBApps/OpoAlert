name: OpoAlert - Investigar seis fuentes pendientes
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/diag_6_pendientes.py,.github/workflows/diag-6-pendientes.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_6_pendientes.py
