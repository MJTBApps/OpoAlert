name: OpoAlert - Preparar BOP Zaragoza auditado
on:
  push:
    branches: [feature/zaragoza-bop-official-20261028]
    paths: ['.github/workflows/stage-zaragoza.yml']
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3'
      - name: Recuperar exclusivamente el resultado de auditoria aprobada
        uses: actions/download-artifact@v4
        with:
          name: zaragoza-bop-30-dias-auditado
          run-id: 40729482210
          repository: MJTBApps/OpoAlert
          github-token: ${{ github.token }}
          path: staging/zaragoza
      - name: Verificar fuente, 30 dias y todos los enlaces
        run: |
          set -eu
          SRC="$(find staging/zaragoza -name 'zaragoza_bop.json' -type f -print -quit)"
          test -n "$SRC"
          python backend/validar_zaragoza_bop.py --file "$SRC" --require-today
          cp "$SRC" docs/zaragoza_bop.json
          python backend/validar_zaragoza_bop.py --file docs/zaragoza_bop.json --require-today
      - name: Guardar el archivo verificado en la rama
        run: |
          set -eu
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/zaragoza_bop.json
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: BOP Zaragoza 30 dias auditados, 750 anuncios'
            git pull --rebase origin feature/zaragoza-bop-official-20261028
            git push origin HEAD:feature/zaragoza-bop-official-20261028
          fi
