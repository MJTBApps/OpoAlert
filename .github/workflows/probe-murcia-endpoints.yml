name: OpoAlert - Probar endpoints BORM Murcia
on:
  push:
    branches: [feature/murcia-borm-20261029]
    paths: [backend/probe_murcia_endpoints.py, .github/workflows/probe-murcia-endpoints.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -u backend/probe_murcia_endpoints.py
