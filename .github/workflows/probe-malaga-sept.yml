name: OpoAlert - Investigar septiembre BOP Malaga
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/probe_malaga_sept.py,.github/workflows/probe-malaga-sept.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probar:
    runs-on: macos-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/probe_malaga_sept.py
