name: OpoAlert - Buscar PDF BOP Jaen 198 199 201
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [backend/probe_jaen_official_pdf.py, .github/workflows/probe-jaen-official-pdf.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests pypdf
      - run: python -u backend/probe_jaen_official_pdf.py
