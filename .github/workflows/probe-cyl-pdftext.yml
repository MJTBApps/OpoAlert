name: OpoAlert - Inspeccionar PDF Soria Palencia y Segovia
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/probe_cyl_pdftext.py,.github/workflows/probe-cyl-pdftext.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pymupdf
      - run: python -u backend/probe_cyl_pdftext.py
