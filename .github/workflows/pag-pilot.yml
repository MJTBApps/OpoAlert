name: OpoAlert - Piloto PAG empleo publico nacional
on:
  push:
    branches: [feature/tarragona-spain-20261028]
    paths:
      - 'backend/pag_probe.py'
      - '.github/workflows/pag-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - name: Verificar exportacion oficial de empleo publico
        run: python -u backend/pag_probe.py
