name: OpoAlert - Verificar historico inicial (legado)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar historico guardado sin redeplegar Pages
        run: python backend/validar_feed.py --input docs/convocatorias.json
