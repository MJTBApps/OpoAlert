name: OpoAlert - Auditar BOA autonomico
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/boa_autonomico.py, .github/workflows/audit-boa-autonomico.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/boa_autonomico.py --output verified/aragon_boa.json
      - uses: actions/upload-artifact@v4
        with:
          name: cierre-aragon-boa-30dias
          path: verified/aragon_boa.json
          retention-days: 30
          if-no-files-found: error
