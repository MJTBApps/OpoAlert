name: OpoAlert - Auditar y publicar BOP Barcelona
on:
  workflow_dispatch:
  schedule:
    - cron: '55 14 * * 1-5'
  push:
    branches: [main]
    paths:
      - backend/barcelona_bop.py
      - backend/validar_barcelona_bop.py
      - backend/tests/test_barcelona_bop.py
      - .github/workflows/revisar-barcelona.yml
concurrency:
  group: opoalert-feed
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar y probar el lector BOP Barcelona
        run: |
          pip install 'beautifulsoup4>=4.12,<5'
          python -m unittest discover -s backend/tests -p test_barcelona_bop.py -v
      - name: Verificar 30 dias, todas las paginas y PDFs originales
        run: python -u backend/barcelona_bop.py --output out_barcelona/barcelona_bop.json
      - name: Verificar el calendario, referencias y enlaces
        run: python backend/validar_barcelona_bop.py --file out_barcelona/barcelona_bop.json --require-today
      - name: Publicar solo BOP Barcelona completo
        run: |
          set -eu
          cp out_barcelona/barcelona_bop.json docs/barcelona_bop.json
          python backend/validar_barcelona_bop.py --file docs/barcelona_bop.json --require-today
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/barcelona_bop.json
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: actualizar BOP Barcelona con auditoria de 30 dias'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barcelona-diagnostico
          path: out_barcelona/*.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Solicitar publicacion unica de los feeds verificados
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
