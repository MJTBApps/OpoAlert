name: OpoAlert - Auditar BOJA autonomico
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/boja_autonomico.py, .github/workflows/audit-boja-autonomico.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/boja_autonomico.py --output verified/andalucia_boja.json
      - uses: actions/upload-artifact@v4
        with:
          name: cierre-andalucia-boja-30dias
          path: verified/andalucia_boja.json
          retention-days: 30
          if-no-files-found: error
