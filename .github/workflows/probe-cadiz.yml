name: OpoAlert - Diagnosticar BOP Cadiz
on:
  workflow_dispatch:
  push:
    branches: [feature/andalucia-cadiz-bop-20261028]
    paths:
      - backend/probe_cadiz_official.py
      - .github/workflows/probe-cadiz.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_cadiz_official.py
