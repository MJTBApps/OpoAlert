name: OpoAlert - Auditar Malaga BOP 30 dias macOS
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/malaga_bop.py,backend/tests/test_malaga_bop.py,.github/workflows/audit-malaga-mac.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: macos-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s backend/tests -p test_malaga_bop.py -v
      - run: python -u backend/malaga_bop.py --output verified/malaga_bop.json
      - uses: actions/upload-artifact@v4
        with:
          name: malaga-bop-index-30d-pdf-original-urls
          path: verified/malaga_bop.json
          retention-days: 15
          if-no-files-found: error
