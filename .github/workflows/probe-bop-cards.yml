name: OpoAlert - Inspeccionar fichas de BOP Barcelona y Girona
on:
  workflow_dispatch:
  push:
    branches: [feature/bop-cataluna-restantes-20261028]
    paths: [backend/probe_bop_cards.py, .github/workflows/probe-bop-cards.yml]
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: python -u backend/probe_bop_cards.py
