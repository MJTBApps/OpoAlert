name: OpoAlert - Verificar índice y anuncios OCR
on:
  workflow_dispatch:
  push:
    branches: [feature/bop-almeria-jaen-20261029]
    paths: ['backend/probe_andalucia_cards.py', '.github/workflows/probe-andalucia-cards.yml']
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_andalucia_cards.py
