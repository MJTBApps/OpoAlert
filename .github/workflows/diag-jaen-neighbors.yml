name: OpoAlert - Buscar ejemplares oficiales faltantes Jaén
on:
  workflow_dispatch:
  push:
    branches: [feature/bop-almeria-jaen-20261029]
    paths: ['backend/diag_jaen_neighboring_public.py', '.github/workflows/diag-jaen-neighbors.yml']
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u backend/diag_jaen_neighboring_public.py
