name: OpoAlert - Diagnostico dias anomalos Zaragoza
on:
  push:
    branches: [feature/zaragoza-bop-official-20261028]
    paths: ['backend/diag_zaragoza_broken.py', '.github/workflows/diag-zaragoza-broken.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u backend/diag_zaragoza_broken.py
