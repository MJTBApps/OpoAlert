name: OpoAlert - Navarra BON datos abiertos oficiales
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/probe_navarra_catalogue_2026.py
      - .github/workflows/probe-navarra-catalogo-2026.yml
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env: {PYTHONIOENCODING: utf-8}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip -q install requests
      - run: python -u backend/probe_navarra_catalogue_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: navarra-catalogo-datos-abiertos-bon-parcial
          path: out/navarra-bon-catalogo-parcial.json
          retention-days: 30
          if-no-files-found: error
