name: OpoAlert - BOCCE detectar enlaces oficiales desde índices públicos
on:
  push:
    branches: [feature/ceuta-melilla-20261029]
    paths: [backend/probe_ceuta_index.py, .github/workflows/probe-ceuta-index.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_ceuta_index.py
