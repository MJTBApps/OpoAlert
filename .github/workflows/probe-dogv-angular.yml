name: OpoAlert - Identificar API DOGV
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/probe_dogv_angular.py, .github/workflows/probe-dogv-angular.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_dogv_angular.py
