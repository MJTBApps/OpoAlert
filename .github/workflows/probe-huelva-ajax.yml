name: OpoAlert - Examinar JSON oficial Huelva
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/probe_huelva_ajax.py,.github/workflows/probe-huelva-ajax.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  peticiones:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_huelva_ajax.py
