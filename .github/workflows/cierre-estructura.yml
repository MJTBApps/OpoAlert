name: OpoAlert - Estructuras fuentes pendientes recuperables
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/cierre_estructura.py, .github/workflows/cierre-estructura.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  examinar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/cierre_estructura.py
