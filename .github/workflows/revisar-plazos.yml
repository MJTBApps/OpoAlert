name: OpoAlert - Leer plazos de los anuncios

# Lee el PDF de cada anuncio nuevo y guarda el plazo de presentación tal como lo
# escribe el anuncio (días hábiles o naturales y la frase literal). No calcula
# fechas. Un archivo por fuente en docs/plazos/; cada PDF se lee una sola vez.
on:
  workflow_dispatch:
  schedule:
    # Después de cada una de las cuatro actualizaciones diarias de los feeds.
    - cron: '20 6 * * *'
    - cron: '20 9 * * *'
    - cron: '20 12 * * *'
    - cron: '20 16 * * *'
  push:
    branches: [main]
    paths:
      - 'backend/plazos.py'
      - '.github/workflows/revisar-plazos.yml'

concurrency:
  group: opoalert-plazos
  cancel-in-progress: false

jobs:
  leer-plazos:
    runs-on: ubuntu-latest
    # Si una fuente falla, el feed anterior sigue publicado: no es una avería.
    # salud-feeds.yml avisa solo si algún feed se queda sin actualizar.
    continue-on-error: true
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Obtener OpoAlert
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de PDF
        run: python -m pip install requests pymupdf
      - name: Pruebas del lector de plazos
        working-directory: backend/tests
        run: python -m unittest -q test_plazos
      - name: Leer los anuncios nuevos
        run: python -u backend/plazos.py update --docs docs --limit 1500
      - name: Guardar plazos en el repositorio
        run: |
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/plazos
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: actualizar plazos de los anuncios'
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Plazos actualizados"
                break
              fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          else
            echo 'Sin plazos nuevos.'
          fi
