name: OpoAlert - Corregir cache Malaga y calendario Huelva
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/probe_ma_hu_cache.py,.github/workflows/probe-ma-hu-cache.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  examinar:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/probe_ma_hu_cache.py
