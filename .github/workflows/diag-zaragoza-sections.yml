name: OpoAlert - Confirmar secciones BOP Zaragoza
on:
  push:
    branches: [feature/zaragoza-bop-official-20261028]
    paths: ['backend/diag_zaragoza_sections.py', '.github/workflows/diag-zaragoza-sections.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u backend/diag_zaragoza_sections.py
