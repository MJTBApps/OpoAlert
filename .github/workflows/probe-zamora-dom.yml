name: OpoAlert - Estructura fiable BOP Zamora
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/probe_zamora_dom.py,.github/workflows/probe-zamora-dom.yml]
permissions: {contents: read}
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_zamora_dom.py
