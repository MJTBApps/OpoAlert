name: OpoAlert - Diagnosticar busqueda Teruel
on:
  push:
    branches: [feature/teruel-bop-audit-20261028]
    paths: ['backend/probe_teruel_forms.py', '.github/workflows/probe-teruel-forms.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_teruel_forms.py
