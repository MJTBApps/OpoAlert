name: OpoAlert - Diagnóstico fuente oficial BOIB
on:
  push:
    branches: [feature/baleares-boib-20261029]
    paths: [backend/diag_baleares_boib.py, .github/workflows/diag-baleares-boib.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_baleares_boib.py
