name: OpoAlert - Probar hemeroteca Caceres
on:
  push:
    branches: [feature/extremadura-tres-fuentes-20261029]
    paths: [backend/probe_extremadura_caceres.py, .github/workflows/probe-ext-caceres.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -u backend/probe_extremadura_caceres.py
