name: OpoAlert - Revisar y publicar BOP Cordoba
on:
  workflow_dispatch:
  schedule:
    - cron: '40 17 * * *'
  push:
    branches: [main]
    paths:
      - backend/cordoba_bop.py
      - backend/validar_cordoba_bop.py
      - backend/tests/test_cordoba_bop.py
      - .github/workflows/revisar-cordoba.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: opoalert-feed-cordoba
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m unittest discover -s backend/tests -p test_cordoba_bop.py -v
      - run: python -m playwright install --with-deps chromium
      - name: Auditar 30 dias, ediciones completas y PDF originales
        run: python -u backend/cordoba_bop.py --days 30 --output out_cordoba/cordoba_bop.json
      - name: Comprobar integridad independiente de 30 dias
        run: python backend/validar_cordoba_bop.py --file out_cordoba/cordoba_bop.json --require-today
      - name: Guardar solamente archivo validado
        run: |
          set -eu
          cp out_cordoba/cordoba_bop.json docs/cordoba_bop.json
          python backend/validar_cordoba_bop.py --file docs/cordoba_bop.json --require-today
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cordoba_bop.json
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: publicar BOP Cordoba auditado'
            for n in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'Cordoba validada y publicada'
                break
              fi
              if [ "$n" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Actualizar GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
