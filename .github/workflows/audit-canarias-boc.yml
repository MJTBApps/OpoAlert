name: OpoAlert - Auditar BOC Canarias 30 dias
on:
  push:
    branches: [feature/canarias-3-boletines-20261029]
    paths: [backend/canarias_boc.py, .github/workflows/audit-canarias-boc.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/canarias_boc.py --output verified/canarias_boc.json
      - uses: actions/upload-artifact@v4
        with:
          name: canarias-boc-autonomico-30dias
          path: verified/canarias_boc.json
          retention-days: 30
          if-no-files-found: error
