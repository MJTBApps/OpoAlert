name: OpoAlert - Auditar BOME Melilla 30 dias
on:
  workflow_dispatch:
  push:
    branches: [feature/ceuta-melilla-20261029]
    paths: [backend/melilla_bome.py, .github/workflows/audit-melilla-bome.yml]
permissions: {contents: read}
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/melilla_bome.py --output verified/melilla_bome.json
      - uses: actions/upload-artifact@v4
        with:
          name: melilla-bome-oficial-30dias
          path: verified/melilla_bome.json
          retention-days: 30
          if-no-files-found: error
