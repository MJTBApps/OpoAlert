name: OpoAlert - Auditar BOCM Madrid 30 dias
on:
  workflow_dispatch:
  push:
    branches: [feature/madrid-bocm-20261029]
    paths: [backend/madrid_bocm.py,backend/validar_madrid_bocm.py,backend/tests/test_madrid_bocm.py,.github/workflows/madrid-bocm-auditar.yml]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s backend/tests -p test_madrid_bocm.py -v
  auditar:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/madrid_bocm.py --days 30 --output auditados/madrid_bocm.json
      - run: python backend/validar_madrid_bocm.py --file auditados/madrid_bocm.json --require-today
      - uses: actions/upload-artifact@v4
        with:
          name: madrid-bocm-verificado-30d
          path: auditados/madrid_bocm.json
          retention-days: 7
          if-no-files-found: error
