name: OpoAlert - Contrastar estructuras oficiales del norte
on:
  push:
    branches: [feature/pais-vasco-cantabria-asturias-20261029]
    paths: [backend/structure_norte.py, .github/workflows/structure-norte.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/structure_norte.py
