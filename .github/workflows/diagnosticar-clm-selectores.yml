name: OpoAlert - Extraer selectores exactos CLM
on:
  push:
    branches: [feature/castilla-la-mancha-completa-20261029]
    paths: [backend/diagnosticar_clm_selectores.py,.github/workflows/diagnosticar-clm-selectores.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diagnosticar_clm_selectores.py
