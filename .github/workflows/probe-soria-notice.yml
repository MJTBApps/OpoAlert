name: OpoAlert - Auditoria Soria estructura anuncios PDF
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/probe_soria_notice.py,.github/workflows/probe-soria-notice.yml]
permissions: {contents: read}
jobs:
  estructura:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_soria_notice.py
