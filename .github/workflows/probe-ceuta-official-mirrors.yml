name: OpoAlert - Recuperar BOCCE oficial por servidores alternativos
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [backend/probe_ceuta_official_mirrors.py, .github/workflows/probe-ceuta-official-mirrors.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -u backend/probe_ceuta_official_mirrors.py
