name: OpoAlert - Auditar y publicar BOP Huesca
on:
  workflow_dispatch:
  schedule:
    # Cuatro veces al día: 6:30, 9:30, 12:30 y 16:30 en invierno (UTC+1);
    # una hora más tarde en verano. Escalonado para no coincidir con otras fuentes.
    - cron: '5 6 * * *'
    - cron: '5 9 * * *'
    - cron: '5 12 * * *'
    - cron: '5 16 * * *'
  push:
    branches: [main]
    paths:
      - backend/huesca_bop.py
      - backend/validar_huesca_bop.py
      - backend/tests/test_huesca_bop.py
      - .github/workflows/revisar-huesca.yml
concurrency:
  group: opoalert-feed
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    # Si una fuente falla, el feed anterior sigue publicado: no es una avería.
    # salud-feeds.yml avisa solo si algún feed se queda sin actualizar.
    continue-on-error: true
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar parser y calendario
        run: |
          pip install 'beautifulsoup4>=4.12,<5'
          python -m unittest discover -s backend/tests -p test_huesca_bop.py -v
      - name: Auditar todos los edictos de los 30 dias
        run: python -u backend/huesca_bop.py --days 30 --output out_huesca/huesca_bop.json
      - name: Validar 30 dias, secuencia y PDF
        run: python backend/validar_huesca_bop.py --file out_huesca/huesca_bop.json --require-today
      - name: Publicar solo si la auditoria completa ha tenido exito
        run: |
          set -eu
          cp out_huesca/huesca_bop.json docs/huesca_bop.json
          python backend/validar_huesca_bop.py --file docs/huesca_bop.json --require-today
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/huesca_bop.json
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: actualizar historico BOP Huesca validado'
            # Otros bots publican a la vez: reintentar en vez de fallar.
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep $((i * 5))
            done
          fi
      - name: Solicitar publicador unico de Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
      - name: Pruebas del fallo sin sustituir feed anterior
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: huesca-diagnostico
          path: out_huesca/*.json
          if-no-files-found: ignore
          retention-days: 3
