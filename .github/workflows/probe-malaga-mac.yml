name: OpoAlert - Explorar HTML BOP Malaga macOS
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/probe_malaga_mac.py,.github/workflows/probe-malaga-mac.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  malaga:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/probe_malaga_mac.py
