name: OpoAlert - Zamora detalle anunciantes y fechas
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/probe_zamora_cards.py,.github/workflows/probe-zamora-cards.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_zamora_cards.py
