name: OpoAlert - Diagnosticar tres fuentes Canarias
on:
  push:
    branches: [feature/canarias-3-boletines-20261029]
    paths: [backend/diag_canarias.py, .github/workflows/diag-canarias.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_canarias.py
