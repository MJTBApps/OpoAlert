name: OpoAlert - Auditar Bizkaia BOB 30 dias
on:
  push:
    branches: [feature/pais-vasco-cantabria-asturias-20261029]
    paths: [backend/bizkaia_bob.py, .github/workflows/audit-bizkaia-bob.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/bizkaia_bob.py --output verified/bizkaia_bob.json
      - uses: actions/upload-artifact@v4
        with:
          name: norte-bizkaia-bob-30dias
          path: verified/bizkaia_bob.json
          retention-days: 30
          if-no-files-found: error
