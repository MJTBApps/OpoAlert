name: OpoAlert - Revisar y publicar boletines de España
# Una ejecución diaria para todas las fuentes de backend/feeds_diarios.py.
# Cada fuente se audita en su propio trabajo: si un portal falla, su feed
# anterior se conserva y el resto se publica igualmente.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * *'
  push:
    branches: [main, 'integracion/**']
    paths:
      - backend/feeds_diarios.py
      - .github/workflows/revisar-espana.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: opoalert-feeds-espana-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuentes:
    runs-on: ubuntu-latest
    outputs:
      codes: ${{ steps.lista.outputs.codes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: lista
        run: echo "codes=$(python backend/feeds_diarios.py matrix)" >> "$GITHUB_OUTPUT"

  auditar:
    needs: fuentes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        code: ${{ fromJSON(needs.fuentes.outputs.codes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install requests beautifulsoup4 certifi cryptography pymupdf pypdf defusedxml tzdata
      - name: Auditar 30 días y validar con las reglas de la app
        # Los portales fallan a veces de forma puntual: un reintento a los 2 minutos.
        # Cada intento tiene un máximo de 15 minutos para que un portal lento no
        # retrase la publicación del resto.
        run: |
          timeout 15m python -u backend/feeds_diarios.py run ${{ matrix.code }} --out out || {
            echo 'Reintento dentro de 2 minutos'; sleep 120
            timeout 15m python -u backend/feeds_diarios.py run ${{ matrix.code }} --out out
          }
      - uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.code }}
          path: out/*.json
          retention-days: 7
          if-no-files-found: error

  publicar:
    needs: auditar
    if: ${{ always() && needs.auditar.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          merge-multiple: true
          path: out
      - name: Validar de nuevo y copiar a docs/
        run: |
          set -eu
          python backend/feeds_diarios.py publish out --docs docs | tee resumen.txt
          { echo '### Feeds diarios'; echo '```'; cat resumen.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar en main
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/*.json
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git commit -m 'OpoAlert: feeds diarios de España auditados'
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then echo 'Feeds publicados'; break; fi
            if [ "$n" -eq 5 ]; then exit 1; fi
            sleep 5
          done
      - name: Actualizar GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
