name: OpoAlert - Examinar NID y PDF DOCM
on:
  push:
    branches: [feature/castilla-la-mancha-completa-20261029]
    paths: [backend/diagnosticar_docm_nid.py,.github/workflows/diagnosticar-docm-nid.yml]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diagnosticar_docm_nid.py
