name: OpoAlert - Subir iOS a TestFlight

# Firma la app iOS y la sube a App Store Connect (TestFlight). Se lanza a mano.
# La firma es automática con la clave de la API de App Store Connect: Xcode crea
# en la nube el certificado y el perfil de distribución. Nada de esto va en el
# repositorio; la clave solo está en los secretos ASC_KEY_ID, ASC_ISSUER_ID y ASC_KEY_P8.
# Identificadores reales de AdMob (opcionales): secretos ADMOB_IOS_APP_ID,
# ADMOB_IOS_BANNER y ADMOB_IOS_OPEN_AD (y ADMOB_IOS_INTERSTITIAL, opcional). Sin ellos se usan los de PRUEBA de Google.
on:
  workflow_dispatch:
    inputs:
      mac:
        description: 'Mac de GitHub (si uno está saturado, probar el otro)'
        type: choice
        default: macos-26
        options: [macos-26, macos-15]

permissions:
  contents: read

concurrency:
  group: opoalert-testflight
  # La nueva sustituye a la que espera Mac (19/11/2026: colas de horas).
  cancel-in-progress: true

jobs:
  subir:
    runs-on: ${{ inputs.mac || 'macos-26' }}
    timeout-minutes: 60
    env:
      TEAM_ID: 6QLP74LVPC
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secreto $name"; exit 1; fi
          done
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) ;;
            *) echo "::error::ASC_KEY_P8 no parece un archivo .p8 completo"; exit 1;;
          esac

      # Xcode 26.3 fijo: la 1.55.1 compilada con 26.5 y 26.6 se cerraba al abrirla
      # (19/11/2026, aborto del sistema de tareas de Swift en iOS 27). Con 26.3 funciona.
      - name: Elegir Xcode 26.3
        run: |
          XCODE="$(ls -d /Applications/Xcode_26.3*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "::error::Este Mac no tiene Xcode 26.3: probar con el otro Mac"; ls -d /Applications/Xcode_*.app; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Fuentes de iOS al dia con Android
        run: python3 scripts/generar_fuentes_ios.py --check

      - name: Comprobar el nucleo y todos los feeds publicados
        working-directory: ios/OpoAlertCore
        run: swift run OpoAlertChecks "$GITHUB_WORKSPACE/docs"

      - name: Archivar y subir a App Store Connect
        env:
          TEAM_ID: ${{ env.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
          ADMOB_IOS_BANNER: ${{ secrets.ADMOB_IOS_BANNER }}
          ADMOB_IOS_OPEN_AD: ${{ secrets.ADMOB_IOS_OPEN_AD }}
          ADMOB_IOS_INTERSTITIAL: ${{ secrets.ADMOB_IOS_INTERSTITIAL }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_SENDER_ID: ${{ secrets.FIREBASE_IOS_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        # Mismo script que Codemagic (codemagic.yaml).
        run: bash scripts/ios_subir_testflight.sh
