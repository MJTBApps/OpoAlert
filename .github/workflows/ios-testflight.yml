name: OpoAlert - Subir iOS a TestFlight

# Firma la app iOS y la sube a App Store Connect (TestFlight). Se lanza a mano.
# La firma es automática con la clave de la API de App Store Connect: Xcode crea
# en la nube el certificado y el perfil de distribución. Nada de esto va en el
# repositorio; la clave solo está en los secretos ASC_KEY_ID, ASC_ISSUER_ID y ASC_KEY_P8.
# Identificadores reales de AdMob (opcionales): secretos ADMOB_IOS_APP_ID,
# ADMOB_IOS_BANNER y ADMOB_IOS_OPEN_AD. Sin ellos se usan los de PRUEBA de Google.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opoalert-testflight
  cancel-in-progress: false

jobs:
  subir:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      TEAM_ID: 6QLP74LVPC
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secreto $name"; exit 1; fi
          done
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) ;;
            *) echo "::error::ASC_KEY_P8 no parece un archivo .p8 completo"; exit 1;;
          esac

      - name: Elegir el Xcode mas reciente
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          case "$(xcodebuild -version | head -1)" in
            "Xcode 2"[6-9]*|"Xcode 3"*) ;;
            *) echo "::error::El App Store exige Xcode 26 o posterior"; exit 1;;
          esac

      - name: Fuentes de iOS al dia con Android
        run: python3 scripts/generar_fuentes_ios.py --check

      - name: Comprobar el nucleo y todos los feeds publicados
        working-directory: ios/OpoAlertCore
        run: swift run OpoAlertChecks "$GITHUB_WORKSPACE/docs"

      - name: Guardar la clave de la API (solo en este ejecutor)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: Generar el proyecto de Xcode
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archivar firmado
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
          ADMOB_IOS_BANNER: ${{ secrets.ADMOB_IOS_BANNER }}
          ADMOB_IOS_OPEN_AD: ${{ secrets.ADMOB_IOS_OPEN_AD }}
        run: |
          set -o pipefail
          ADMOB=()
          if [ -n "$ADMOB_IOS_APP_ID" ] && [ -n "$ADMOB_IOS_BANNER" ] && [ -n "$ADMOB_IOS_OPEN_AD" ]; then
            ADMOB=(ADMOB_APP_ID="$ADMOB_IOS_APP_ID" ADMOB_BANNER="$ADMOB_IOS_BANNER" ADMOB_OPEN_AD="$ADMOB_IOS_OPEN_AD")
          else
            echo "::warning::Sin los secretos ADMOB_IOS_*: esta compilación lleva los anuncios de PRUEBA de Google (vale para TestFlight, no para el App Store)"
          fi
          # Número de compilación: uno más en cada ejecución (App Store Connect no admite repetidos).
          # Se archiva sin firmar: firmar aquí pide un perfil de desarrollo, y ese perfil
          # exige un iPhone registrado (fallo del 05/11/2026). La firma de distribución
          # la hace el paso siguiente.
          xcodebuild -project OpoAlert.xcodeproj -scheme OpoAlert -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/OpoAlert.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${ADMOB[@]}" \
            archive | tail -n 80

      - name: Subir a App Store Connect
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # Las librerías de Google (anuncios y consentimiento) llegan al archivo sin
          # firmar con una firma de Google que ya no es válida, y App Store Connect las
          # rechazaba (05/11/2026). Sin firma, la exportación las firma con la app.
          for fw in build/OpoAlert.xcarchive/Products/Applications/OpoAlert.app/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            echo "Quitar la firma de $(basename "$fw")"
            codesign --remove-signature "$fw" || true
            rm -rf "$fw/_CodeSignature"
          done
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/OpoAlert.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 60
          echo "Subida la compilación ${{ github.run_number }}. App Store Connect tarda unos minutos en procesarla."

      - name: Borrar la clave
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
