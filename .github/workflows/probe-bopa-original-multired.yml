name: OpoAlert - Asturias BOPA originales multired
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/probe_bopa_original_multired_2026.py
      - .github/workflows/probe-bopa-original-multired.yml
permissions: {contents: read}
env: {PYTHONIOENCODING: utf-8}
jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/probe_bopa_original_multired_2026.py
