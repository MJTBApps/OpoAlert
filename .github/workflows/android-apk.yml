name: OpoAlert - Compilar APK Android 1.0.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/test_ui_080.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: opoalert-build-android
  cancel-in-progress: false

jobs:
  crear-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Comprobar pantalla selector y favoritos de OpoAlert 1.0
        run: python3 scripts/test_ui_080.py
      - name: Tests Kotlin y compilar APK
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Verificar APK Android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk OpoAlert-1.0.0.apk
          unzip -t OpoAlert-1.0.0.apk >/dev/null
          sha256sum OpoAlert-1.0.0.apk
      - name: Descargar APK desde GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: OpoAlert-Android-1.0.0
          path: OpoAlert-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
