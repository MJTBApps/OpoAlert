name: OpoAlert - Crear APK Android 0.8.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/test_ui_080.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: opoalert-build-android
  cancel-in-progress: false

jobs:
  crear-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35 del runner
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Validar estructura de interfaz 0.8
        run: python3 scripts/test_ui_080.py
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK Android
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk OpoAlert-0.8.0.apk
          unzip -t OpoAlert-0.8.0.apk > /dev/null
          sha256sum OpoAlert-0.8.0.apk
      - name: Guardar APK descargable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpoAlert-Android-0.8.0
          path: OpoAlert-0.8.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.0 >/dev/null 2>&1; then
            gh release upload v0.8.0 OpoAlert-0.8.0.apk --clobber
          else
            gh release create v0.8.0 OpoAlert-0.8.0.apk \
              --target "${{ github.sha }}" \
              --title "OpoAlert 0.8.0 - Interfaz renovada" \
              --notes "Android nativo: interfaz compacta, tarjetas de convocatorias legibles, icono de actualizar corregido, avisos al primer inicio, fuente publica ya configurada, favoritos, buscador y filtros. Compilacion de prueba con clave Android Debug Key propia del runner. La instalacion sobre una APK con otra firma puede requerir desinstalar la anterior (se perderan sus favoritos locales)."
          fi
