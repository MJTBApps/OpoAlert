name: OpoAlert - Compilar APK Android 1.42.0

on:
  workflow_dispatch:
  push:
    branches: [main, 'integracion/**']
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/test_ui_080.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: opoalert-build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crear-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Comprobar pantalla selector, favoritos, ficha y navegacion OpoAlert 1.42.0
        run: python3 scripts/test_ui_080.py
      - name: Firma fija de OpoAlert (secretos del repositorio)
        env:
          KEYSTORE_B64: ${{ secrets.OPOALERT_KEYSTORE_B64 }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto OPOALERT_KEYSTORE_B64: sin firma fija no se publica la APK"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/opoalert.jks"
          echo "OPOALERT_KEYSTORE=$RUNNER_TEMP/opoalert.jks" >> "$GITHUB_ENV"
      - name: Tests Kotlin y compilar APK
        env:
          OPOALERT_KEY_PASSWORD: ${{ secrets.OPOALERT_KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Verificar APK Android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk OpoAlert-1.42.0.apk
          unzip -t OpoAlert-1.42.0.apk >/dev/null
          # La firma debe ser siempre la de OpoAlert para que el móvil acepte la actualización.
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs OpoAlert-1.42.0.apk \
            | grep -i "SHA-256 digest: 0c549105e420ffdf8ae9861cfe0893883bf46b6ace1634e21010b25b3d8b7a3b"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging OpoAlert-1.42.0.apk | grep "package: name='es.opoalert.app' versionCode='55' versionName='1.42.0'"
          sha256sum OpoAlert-1.42.0.apk
      - name: Descargar APK desde GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: OpoAlert-Android-1.42.0
          path: OpoAlert-1.42.0.apk
          if-no-files-found: error
          retention-days: 30
