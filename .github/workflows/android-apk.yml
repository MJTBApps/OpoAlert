name: OpoAlert - Crear APK Android 0.8.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/test_ui_080.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: opoalert-build-android
  cancel-in-progress: false

jobs:
  crear-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35 del runner
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Validar estructura de interfaz 0.8.2
        run: python3 scripts/test_ui_080.py
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Probar buscador y compilar APK Android
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk OpoAlert-0.8.2.apk
          unzip -t OpoAlert-0.8.2.apk > /dev/null
          sha256sum OpoAlert-0.8.2.apk
      - name: Guardar APK descargable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpoAlert-Android-0.8.2
          path: OpoAlert-0.8.2.apk
          if-no-files-found: error
          retention-days: 30
      - name: Indicar ubicacion de APK verificada
        run: |
          echo "### OpoAlert 0.8.2" >> "$GITHUB_STEP_SUMMARY"
          echo "APK disponible en Artefactos: OpoAlert-Android-0.8.2 (30 dias)." >> "$GITHUB_STEP_SUMMARY"
