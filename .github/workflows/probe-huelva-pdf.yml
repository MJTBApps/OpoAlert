name: OpoAlert - Verificar PDF de Huelva
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/probe_huelva_pdf.py,.github/workflows/probe-huelva-pdf.yml]
permissions: {contents: read}
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -u backend/probe_huelva_pdf.py
