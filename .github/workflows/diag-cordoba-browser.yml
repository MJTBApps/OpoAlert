name: OpoAlert - Renderizar Cordoba NextJS
on:
  workflow_dispatch:
  push:
    branches: [feature/andalucia-resto-20261029]
    paths: ['backend/diag_cordoba_playwright.py','.github/workflows/diag-cordoba-browser.yml']
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -u backend/diag_cordoba_playwright.py
