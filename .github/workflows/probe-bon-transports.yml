name: OpoAlert - Probar accesos alternativos BON
on:
  workflow_dispatch:
  push:
    branches: [feature/navarra-rioja-20261029]
    paths:
      - 'backend/probe_bon_transports.py'
      - '.github/workflows/probe-bon-transports.yml'
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/probe_bon_transports.py
