name: OpoAlert - Revisar diarios abiertos DOGV DOGC
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/diag_dogv_dogc.py, .github/workflows/diag-dogv-dogc.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_dogv_dogc.py
