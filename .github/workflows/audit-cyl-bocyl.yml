name: OpoAlert - Auditar BOCYL autonomico 30 dias
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/cyl_bocyl.py,backend/tests/test_cyl_bocyl.py,.github/workflows/audit-cyl-bocyl.yml]
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s backend/tests -p test_cyl_bocyl.py -v
      - run: python -u backend/cyl_bocyl.py --output verified/castilla_leon_bocyl.json
      - uses: actions/upload-artifact@v4
        with:
          name: cyl-bocyl-autonomico-30dias
          path: verified/castilla_leon_bocyl.json
          retention-days: 15
          if-no-files-found: error
