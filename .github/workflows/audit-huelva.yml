name: OpoAlert - Auditar Huelva BOP 30 dias
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/huelva_bop.py,backend/tests/test_huelva_bop.py,.github/workflows/audit-huelva.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s backend/tests -p test_huelva_bop.py -v
      - run: python -u backend/huelva_bop.py --output verified/huelva_bop.json
      - uses: actions/upload-artifact@v4
        with:
          name: huelva-bop-30dias
          path: verified/huelva_bop.json
          retention-days: 15
          if-no-files-found: error
