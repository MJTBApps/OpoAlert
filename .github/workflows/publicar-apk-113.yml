name: OpoAlert - Publicar APK 1.13.0 en web
on:
  workflow_run:
    workflows: ['OpoAlert - Compilar APK Android 1.13.0']
    types: [completed]
permissions:
  actions: read
  contents: write
concurrency:
  group: opoalert-publicar-apk-113
  cancel-in-progress: false
jobs:
  publicar:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Descargar APK de la compilacion confirmada en main
        uses: actions/download-artifact@v4
        with:
          name: OpoAlert-Android-1.13.0
          run-id: ${{ github.event.workflow_run.id }}
          repository: MJTBApps/OpoAlert
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar APK y actualizar descarga publica
        run: |
          set -eu
          test -s apk/OpoAlert-1.13.0.apk
          unzip -t apk/OpoAlert-1.13.0.apk >/dev/null
          cp apk/OpoAlert-1.13.0.apk docs/OpoAlert-1.13.0.apk
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs/index.html")
          content=p.read_text(encoding="utf-8")
          content=content.replace("OpoAlert-1.12.0.apk", "OpoAlert-1.13.0.apk")
          content=content.replace("Descargar OpoAlert 1.12 para Android", "Descargar OpoAlert 1.13 para Android")
          p.write_text(content,encoding="utf-8")
          PY
          sha256sum docs/OpoAlert-1.13.0.apk
      - name: Guardar artefacto y portada con reintentos
        run: |
          set -eu
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/OpoAlert-1.13.0.apk
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: publicar instalador Android 1.13 con Granada y Sevilla'
            for n in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'Android 1.13 publicado en docs'
                break
              fi
              if [ "$n" -eq 5 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Iniciar despliegue web
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
