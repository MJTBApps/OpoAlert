name: OpoAlert - Diagnosticar BOP Almería y Jaén
on:
  workflow_dispatch:
  push:
    branches: [feature/bop-almeria-jaen-20261029]
    paths:
      - backend/probe_andalucia_20261029.py
      - .github/workflows/probe-andalucia-20261029.yml
permissions:
  contents: read
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: python -u backend/probe_andalucia_20261029.py
