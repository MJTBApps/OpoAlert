name: OpoAlert - Auditar DOGV Comunidad Valenciana
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/dogv_autonomico.py, .github/workflows/audit-dogv-autonomico.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/dogv_autonomico.py --output verified/valencia_dogv.json
      - uses: actions/upload-artifact@v4
        with:
          name: cierre-valencia-dogv-30dias
          path: verified/valencia_dogv.json
          retention-days: 30
          if-no-files-found: error
