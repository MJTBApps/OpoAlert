name: OpoAlert - Selectores anuncios CyL
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/diag_cyl_cards.py,.github/workflows/diag-cyl-cards.yml]
permissions: {contents: read}
jobs:
  dom:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_cyl_cards.py
