name: OpoAlert - Probar OpenData BOPA 2026
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [backend/probe_bopa_open_data_2026.py, .github/workflows/probe-bopa-open-data-2026.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/probe_bopa_open_data_2026.py
