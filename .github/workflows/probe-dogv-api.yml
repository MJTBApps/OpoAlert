name: OpoAlert - Consultar índices oficiales DOGV
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/probe_dogv_api.py, .github/workflows/probe-dogv-api.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -u backend/probe_dogv_api.py
