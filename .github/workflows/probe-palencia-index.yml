name: OpoAlert - Estructura sumarios PDF Palencia
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/probe_palencia_index.py,.github/workflows/probe-palencia-index.yml]
permissions: {contents: read}
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pymupdf
      - run: python -u backend/probe_palencia_index.py
