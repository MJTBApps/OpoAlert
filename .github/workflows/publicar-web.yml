name: OpoAlert - Publicar portada nacional y feeds
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'OpoAlert - Publicar historico BOP auditado'
      - 'OpoAlert - Auditar y publicar BOP Alicante Castellon'
      - 'OpoAlert España - Auditar y publicar BOE nacional'
      - 'OpoAlert - Publicar CIDO Cataluna verificado'
      - 'OpoAlert - Auditar y publicar BOP Tarragona'
      - 'OpoAlert - Auditar y publicar BOP Barcelona'
      - 'OpoAlert - Auditar y publicar BOP Girona'
      - 'OpoAlert - Auditar y publicar BOP Huesca'
      - 'OpoAlert - Auditar y publicar BOP Teruel'
      - 'OpoAlert - Auditar y publicar BOP Zaragoza'
      - 'OpoAlert - Publicar APK 1.11.0 en web'
      - 'OpoAlert - Revisar y publicar BOP Cadiz'
      - 'OpoAlert - Revisar y publicar BOP Almeria'
      - 'OpoAlert - Revisar y publicar BOP Granada Sevilla'
      - 'OpoAlert - Publicar APK 1.13.0 en web'
      - 'OpoAlert - Revisar y publicar BOP Cordoba'
      - 'OpoAlert - Revisar y publicar BOCM Madrid'
      - 'OpoAlert - Publicar APK 1.15.0 en web'
      - 'OpoAlert - Publicar APK 1.34.0 en web'
      - 'OpoAlert - Publicar APK 1.35.0 en web'
      - 'OpoAlert - Publicar APK 1.36.0 en web'
      - 'OpoAlert - Publicar APK 1.14.0 en web'
      - 'OpoAlert - Publicar APK 1.12.0 en web'
    types: [completed]
  schedule:
    # Dos veces al día: mañana y tarde (UTC; en España +1 h en invierno, +2 h en verano).
    - cron: '40 7 * * *'
    - cron: '40 15 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publicar-web.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: opoalert-pages-unico
  cancel-in-progress: true
jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar contenido minimo de la web
        run: |
          test -s docs/index.html
          test -s docs/OpoAlert-1.8.0.apk
          test -s docs/OpoAlert-1.9.0.apk
          test -s docs/OpoAlert-1.10.0.apk
          test -s docs/OpoAlert-1.11.0.apk
          test -s docs/OpoAlert-1.12.0.apk
          test -s docs/barcelona_bop.json
          test -s docs/girona_bop.json
          test -s docs/huesca_bop.json
          test -s docs/teruel_bop.json
          test -s docs/zaragoza_bop.json
          test -s docs/cadiz_bop.json
          test -s docs/almeria_bop.json
          test -s docs/madrid_bocm.json
          test -s docs/convocatorias.json
      - name: Lista de fuentes activas para la app
        run: python3 backend/feeds_diarios.py manifest --docs docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
