name: OpoAlert - Publicar portada nacional y feeds
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'OpoAlert - Publicar historico BOP auditado'
      - 'OpoAlert - Auditar y publicar BOP Alicante Castellon'
      - 'OpoAlert España - Auditar y publicar BOE nacional'
      - 'OpoAlert - Publicar CIDO Cataluna verificado'
      - 'OpoAlert - Auditar y publicar BOP Tarragona'
      - 'OpoAlert - Auditar y publicar BOP Barcelona'
      - 'OpoAlert - Auditar y publicar BOP Girona'
      - 'OpoAlert - Auditar y publicar BOP Huesca'
      - 'OpoAlert - Auditar y publicar BOP Teruel'
      - 'OpoAlert - Auditar y publicar BOP Zaragoza'
      - 'OpoAlert - Publicar APK 1.11.0 en web'
      - 'OpoAlert - Revisar y publicar BOP Cadiz'
      - 'OpoAlert - Revisar y publicar BOP Almeria'
      - 'OpoAlert - Revisar y publicar BOP Granada Sevilla'
      - 'OpoAlert - Publicar APK 1.13.0 en web'
      - 'OpoAlert - Revisar y publicar BOP Cordoba'
      - 'OpoAlert - Revisar y publicar BOCM Madrid'
      - 'OpoAlert - Publicar APK 1.15.0 en web'
      - 'OpoAlert - Publicar APK 1.34.0 en web'
      - 'OpoAlert - Publicar APK 1.35.0 en web'
      - 'OpoAlert - Publicar APK 1.36.0 en web'
      - 'OpoAlert - Publicar APK 1.37.0 en web'
      - 'OpoAlert - Publicar APK 1.38.0 en web'
      - 'OpoAlert - Publicar APK 1.39.0 en web'
      - 'OpoAlert - Publicar APK 1.40.0 en web'
      - 'OpoAlert - Publicar APK 1.41.0 en web'
      - 'OpoAlert - Publicar APK 1.42.0 en web'
      - 'OpoAlert - Publicar APK 1.43.0 en web'
      - 'OpoAlert - Publicar APK 1.44.0 en web'
      - 'OpoAlert - Publicar APK 1.45.0 en web'
      - 'OpoAlert - Publicar APK 1.46.0 en web'
      - 'OpoAlert - Publicar APK 1.47.0 en web'
      - 'OpoAlert - Publicar APK 1.48.0 en web'
      - 'OpoAlert - Publicar APK 1.49.0 en web'
      - 'OpoAlert - Publicar APK 1.50.0 en web'
      - 'OpoAlert - Publicar APK 1.51.0 en web'
      - 'OpoAlert - Publicar APK 1.52.0 en web'
      - 'OpoAlert - Publicar APK 1.53.0 en web'
      - 'OpoAlert - Publicar APK 1.53.1 en web'
      - 'OpoAlert - Publicar APK 1.53.2 en web'
      - 'OpoAlert - Publicar APK 1.53.3 en web'
      - 'OpoAlert - Publicar APK 1.54.0 en web'
      - 'OpoAlert - Leer plazos de los anuncios'
      - 'OpoAlert - Publicar APK 1.14.0 en web'
      - 'OpoAlert - Publicar APK 1.12.0 en web'
    types: [completed]
  schedule:
    # Cuatro veces al día: 6:30, 9:30, 12:30 y 16:30 en invierno (UTC+1);
    # una hora más tarde en verano. Escalonado para no coincidir con otras fuentes.
    - cron: '55 6 * * *'
    - cron: '55 9 * * *'
    - cron: '55 12 * * *'
    - cron: '55 16 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publicar-web.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: opoalert-pages-unico
  # No cancelar la publicación en curso: cancelar el workflow no para el despliegue
  # de Pages y el siguiente fallaba con «in progress deployment» (04/11/2026).
  # Las que esperan se sustituyen por la más reciente, que ya lleva todos los feeds.
  cancel-in-progress: false
jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar contenido minimo de la web
        run: |
          test -s docs/index.html
          test -s docs/OpoAlert-1.8.0.apk
          test -s docs/OpoAlert-1.9.0.apk
          test -s docs/OpoAlert-1.10.0.apk
          test -s docs/OpoAlert-1.11.0.apk
          test -s docs/OpoAlert-1.12.0.apk
          test -s docs/barcelona_bop.json
          test -s docs/girona_bop.json
          test -s docs/huesca_bop.json
          test -s docs/teruel_bop.json
          test -s docs/zaragoza_bop.json
          test -s docs/cadiz_bop.json
          test -s docs/almeria_bop.json
          test -s docs/madrid_bocm.json
          test -s docs/convocatorias.json
      - name: Lista de fuentes activas para la app
        run: python3 backend/feeds_diarios.py manifest --docs docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Si aún quedaba un despliegue de Pages en curso, esperar y volver a intentarlo.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # 1.54.0: aviso silencioso a los móviles (Firebase) si hay anuncios nuevos.
      # Sin el secreto FIREBASE_SERVICE_ACCOUNT no hace nada. Nunca hace fallar la web.
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .aviso
          key: aviso-fcm-${{ github.run_id }}
          restore-keys: aviso-fcm-
      - name: Avisar a los móviles
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then pip install --quiet google-auth requests; fi
          python3 backend/aviso_fcm.py --docs docs --state .aviso/estado.json
      - uses: actions/cache/save@v4
        if: hashFiles('.aviso/estado.json') != ''
        continue-on-error: true
        with:
          path: .aviso
          key: aviso-fcm-${{ github.run_id }}
