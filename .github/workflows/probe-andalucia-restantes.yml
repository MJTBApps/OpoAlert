name: OpoAlert - Diagnosticar BOP resto de Andalucia
on:
  workflow_dispatch:
  push:
    branches: [feature/andalucia-resto-20261029]
    paths:
      - backend/probe_andalucia_restantes.py
      - .github/workflows/probe-andalucia-restantes.yml
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_andalucia_restantes.py
