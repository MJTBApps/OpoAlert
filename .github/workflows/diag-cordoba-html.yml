name: OpoAlert - Diagnosticar estructura Cordoba
on:
  workflow_dispatch:
  push:
    branches: [feature/andalucia-resto-20261029]
    paths: ['backend/diag_cordoba_html.py','.github/workflows/diag-cordoba-html.yml']
permissions:
  contents: read
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_cordoba_html.py
