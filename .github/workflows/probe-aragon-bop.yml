name: OpoAlert - Investigar BOP Aragon
on:
  workflow_dispatch:
  push:
    branches: [feature/selector-ccaa-aragon-20261028]
    paths:
      - backend/probe_aragon_bop.py
      - .github/workflows/probe-aragon-bop.yml
permissions:
  contents: read
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: python -u backend/probe_aragon_bop.py
