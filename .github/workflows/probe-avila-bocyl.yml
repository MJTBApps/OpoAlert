name: OpoAlert - Diagnosticar erratas Avila y estructura BOCYL
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/probe_avila_bocyl.py,.github/workflows/probe-avila-bocyl.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_avila_bocyl.py
