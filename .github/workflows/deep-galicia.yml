name: OpoAlert - Estructura historicos Galicia
on:
  push:
    branches: [feature/galicia-cinco-boletines-20261029]
    paths: [backend/deep_galicia.py, .github/workflows/deep-galicia.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/deep_galicia.py
