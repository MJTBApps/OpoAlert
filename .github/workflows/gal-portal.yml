name: OpoAlert - Verificar rutas Ourense Pontevedra
on:
  push:
    branches: [feature/galicia-cinco-boletines-20261029]
    paths: [backend/gal_portal.py, .github/workflows/gal-portal.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/gal_portal.py
