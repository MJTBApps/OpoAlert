name: OpoAlert - Verificar PDF oficial numeracion Avila 6 octubre
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/probe_avila_pdf_number.py,.github/workflows/probe-avila-pdf-number.yml]
permissions: {contents: read}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests pymupdf
      - run: python -u backend/probe_avila_pdf_number.py
