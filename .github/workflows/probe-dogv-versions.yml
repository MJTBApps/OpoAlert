name: OpoAlert - Versiones extraordinarias DOGV
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/probe_dogv_versions.py, .github/workflows/probe-dogv-versions.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -u backend/probe_dogv_versions.py
