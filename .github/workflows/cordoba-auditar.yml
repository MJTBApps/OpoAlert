name: OpoAlert - Auditar 30 dias BOP Cordoba
on:
  workflow_dispatch:
  push:
    branches: [feature/andalucia-resto-20261029]
    paths:
      - backend/cordoba_bop.py
      - backend/validar_cordoba_bop.py
      - backend/tests/test_cordoba_bop.py
      - .github/workflows/cordoba-auditar.yml
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m unittest discover -s backend/tests -p test_cordoba_bop.py -v
  auditar:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -u backend/cordoba_bop.py --days 30 --output auditados/cordoba_bop.json
      - run: python backend/validar_cordoba_bop.py --file auditados/cordoba_bop.json --require-today
      - uses: actions/upload-artifact@v4
        with:
          name: cordoba-bop-verificado-30d
          path: auditados/cordoba_bop.json
          retention-days: 7
          if-no-files-found: error
