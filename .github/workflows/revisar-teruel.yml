name: OpoAlert - Auditar y publicar BOP Teruel
on:
  workflow_dispatch:
  schedule:
    # Cuatro veces al día: 6:30, 9:30, 12:30 y 16:30 en invierno (UTC+1);
    # una hora más tarde en verano. Escalonado para no coincidir con otras fuentes.
    - cron: '10 6 * * *'
    - cron: '10 9 * * *'
    - cron: '10 12 * * *'
    - cron: '10 16 * * *'
  push:
    branches: [main]
    paths:
      - backend/teruel_bop.py
      - backend/validar_teruel_bop.py
      - backend/tests/test_teruel_bop.py
      - .github/workflows/revisar-teruel.yml
concurrency:
  group: opoalert-feed-teruel
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar fechas, paginacion y validacion de enlaces
        run: |
          pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
          python -m unittest discover -s backend/tests -p test_teruel_bop.py -v
      - name: Auditar todos los edictos de los ultimos 30 dias
        run: python -u backend/teruel_bop.py --days 30 --output out_teruel/teruel_bop.json
      - name: Validar historico, numeracion y anuncios originales
        run: python backend/validar_teruel_bop.py --file out_teruel/teruel_bop.json --require-today
      - name: Publicar solo si la auditoria completa ha tenido exito
        run: |
          set -eu
          cp out_teruel/teruel_bop.json docs/teruel_bop.json
          python backend/validar_teruel_bop.py --file docs/teruel_bop.json --require-today
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/teruel_bop.json
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: actualizar historico BOP Teruel validado'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Solicitar publicador unico de Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
      - name: Guardar diagnostico si la fuente cambia o falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teruel-diagnostico
          path: out_teruel/*.json
          if-no-files-found: ignore
          retention-days: 3
