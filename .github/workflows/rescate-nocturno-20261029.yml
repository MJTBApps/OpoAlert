name: OpoAlert - Rescate nocturno oficial parcial
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/rescate_nocturno_20261029.py
      - .github/workflows/rescate-nocturno-20261029.yml
permissions:
  contents: read
jobs:
  recuperar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 13
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias y comprobaciones previas
        run: |
          python -m pip install requests beautifulsoup4 pypdf
          python -m py_compile backend/rescate_nocturno_20261029.py
          python backend/rescate_nocturno_20261029.py --self-test
      - name: Recolectar evidencia parcial de Jaén y revisar fuentes restantes
        run: python -u backend/rescate_nocturno_20261029.py --output out/rescate-${{ matrix.os }}.json --max-jaen-pdfs 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noche-oficial-parcial-${{ matrix.os }}
          path: out/rescate-${{ matrix.os }}.json
          retention-days: 30
          if-no-files-found: warn
