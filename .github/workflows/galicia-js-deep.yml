name: OpoAlert - Explorar calendario Pontevedra y rutas Angular Ourense
on:
  push:
    branches: [feature/galicia-cinco-boletines-20261029]
    paths: [backend/galicia_js_deep.py, .github/workflows/galicia-js-deep.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/galicia_js_deep.py
