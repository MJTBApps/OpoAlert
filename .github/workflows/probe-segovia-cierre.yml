name: OpoAlert - Verificar PDF y calendario Segovia
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/probe_segovia_cierre.py, .github/workflows/probe-segovia-cierre.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pypdf
      - run: python -u backend/probe_segovia_cierre.py
