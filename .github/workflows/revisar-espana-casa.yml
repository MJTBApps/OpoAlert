name: OpoAlert - Revisar boletines desde el PC de casa
# Portales que no responden a los servidores de GitHub pero sí desde una
# conexión española (feeds_diarios.HOME_ONLY y HOME_BACKUP). La lectura se hace
# en el ejecutor propio de casa (etiqueta opoalert-casa, ver EJECUTOR_CASA.md);
# la validación y la publicación, en GitHub como el resto de fuentes.
# Seguridad: solo horario y lanzamiento manual, nunca pull requests.
on:
  workflow_dispatch:
  schedule:
    # 20 minutos después de cada tanda de GitHub: 6:50, 9:50, 12:50 y 16:50 en invierno.
    - cron: '50 5 * * *'
    - cron: '50 8 * * *'
    - cron: '50 11 * * *'
    - cron: '50 15 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: opoalert-feeds-casa
  cancel-in-progress: false
jobs:
  fuentes:
    if: github.repository == 'MJTBApps/OpoAlert' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      codes: ${{ steps.lista.outputs.codes }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        run: echo "codes=$(python3 backend/feeds_diarios.py matrix --where casa)" >> "$GITHUB_OUTPUT"

  auditar:
    needs: fuentes
    if: needs.fuentes.outputs.codes != '[]'
    runs-on: [self-hosted, opoalert-casa]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        code: ${{ fromJSON(needs.fuentes.outputs.codes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Auditar 30 días desde casa y validar con las reglas de la app
        # OPOALERT_PYTHON se define en el archivo .env del ejecutor (EJECUTOR_CASA.md).
        shell: bash
        run: |
          set -u
          "$OPOALERT_PYTHON" -u backend/feeds_diarios.py run ${{ matrix.code }} --out out || {
            echo 'Reintento dentro de 2 minutos'; sleep 120
            "$OPOALERT_PYTHON" -u backend/feeds_diarios.py run ${{ matrix.code }} --out out
          }
      - uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.code }}
          path: out/*.json
          retention-days: 7
          if-no-files-found: error

  publicar:
    needs: auditar
    if: ${{ always() && needs.auditar.result != 'cancelled' && needs.auditar.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          merge-multiple: true
          path: out
      - name: Validar de nuevo y copiar a docs/
        run: |
          set -eu
          mkdir -p out
          python backend/feeds_diarios.py publish out --docs docs | tee resumen.txt
          { echo '### Feeds leídos desde casa'; echo '```'; cat resumen.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar en main
        run: |
          set -eu
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/*.json
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git commit -m 'OpoAlert: feeds leídos desde el PC de casa'
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then echo 'Feeds publicados'; break; fi
            if [ "$n" -eq 5 ]; then exit 1; fi
            sleep 5
          done
      - name: Actualizar GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
