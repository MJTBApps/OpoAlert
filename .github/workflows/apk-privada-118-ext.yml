name: OpoAlert - Extremadura 1.18 APK privada
on:
  workflow_dispatch:
  push:
    branches: [feature/extremadura-tres-fuentes-20261029]
    paths: [.github/workflows/apk-privada-118-ext.yml, backend/validar_apk_ext.py, scripts/test_ui_080.py]
permissions:
  contents: read
  actions: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: madrid-bocm-verificado-solo-prueba
          repository: MJTBApps/OpoAlert
          run-id: 40841935151
          github-token: ${{ github.token }}
          path: verified/madrid
      - uses: actions/download-artifact@v4
        with:
          name: huelva-bop-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40842937607
          github-token: ${{ github.token }}
          path: verified/huelva
      - uses: actions/download-artifact@v4
        with:
          name: ciudad-real-auditado-local
          repository: MJTBApps/OpoAlert
          run-id: 40839994664
          github-token: ${{ github.token }}
          path: verified/ciudad_real
      - uses: actions/download-artifact@v4
        with:
          name: clm-guadalajara-auditado
          repository: MJTBApps/OpoAlert
          run-id: 40839179580
          github-token: ${{ github.token }}
          path: verified/guadalajara
      - uses: actions/download-artifact@v4
        with:
          name: toledo-auditado-local
          repository: MJTBApps/OpoAlert
          run-id: 40839339286
          github-token: ${{ github.token }}
          path: verified/toledo
      - uses: actions/download-artifact@v4
        with:
          name: docm-auditado-local
          repository: MJTBApps/OpoAlert
          run-id: 40840362204
          github-token: ${{ github.token }}
          path: verified/docm
      - uses: actions/download-artifact@v4
        with:
          name: cyl-avila-bop-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40845587789
          github-token: ${{ github.token }}
          path: verified/avila
      - uses: actions/download-artifact@v4
        with:
          name: cyl-leon-bop-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40845225974
          github-token: ${{ github.token }}
          path: verified/leon
      - uses: actions/download-artifact@v4
        with:
          name: cyl-zamora-bop-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40846609066
          github-token: ${{ github.token }}
          path: verified/zamora
      - uses: actions/download-artifact@v4
        with:
          name: cyl-soria-bop-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40847250751
          github-token: ${{ github.token }}
          path: verified/soria
      - uses: actions/download-artifact@v4
        with:
          name: cyl-palencia-bop-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40848267071
          github-token: ${{ github.token }}
          path: verified/palencia
      - uses: actions/download-artifact@v4
        with:
          name: cyl-bocyl-autonomico-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40845310831
          github-token: ${{ github.token }}
          path: verified/bocyl
      - uses: actions/download-artifact@v4
        with:
          name: extremadura-badajoz-bop-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40850935583
          github-token: ${{ github.token }}
          path: verified/badajoz
      - uses: actions/download-artifact@v4
        with:
          name: extremadura-caceres-bop-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40850591480
          github-token: ${{ github.token }}
          path: verified/caceres
      - uses: actions/download-artifact@v4
        with:
          name: extremadura-doe-30dias
          repository: MJTBApps/OpoAlert
          run-id: 40850174258
          github-token: ${{ github.token }}
          path: verified/doe
      - name: Empaquetar solo copias oficiales verificadas en APK local
        run: |
          set -eu
          mkdir -p app/src/main/assets/verified
          cp verified/madrid/madrid_bocm.json app/src/main/assets/verified/MD.json
          cp verified/huelva/huelva_bop.json app/src/main/assets/verified/HB.json
          cp verified/ciudad_real/ciudad_real_bop.json app/src/main/assets/verified/CR.json
          cp verified/guadalajara/guadalajara_bop.json app/src/main/assets/verified/GJ.json
          cp verified/toledo/toledo_bop.json app/src/main/assets/verified/TO.json
          cp verified/docm/castilla_mancha_docm.json app/src/main/assets/verified/CM.json
          cp verified/avila/avila_bop.json app/src/main/assets/verified/AV.json
          cp verified/leon/leon_bop.json app/src/main/assets/verified/LN.json
          cp verified/zamora/zamora_bop.json app/src/main/assets/verified/ZM.json
          cp verified/soria/soria_bop.json app/src/main/assets/verified/SR.json
          cp verified/bocyl/castilla_leon_bocyl.json app/src/main/assets/verified/CY.json
          cp verified/palencia/palencia_bop.json app/src/main/assets/verified/PL.json
          cp verified/badajoz/badajoz_bop.json app/src/main/assets/verified/BD.json
          cp verified/caceres/caceres_bop.json app/src/main/assets/verified/CC.json
          cp verified/doe/extremadura_doe.json app/src/main/assets/verified/EX.json
          python backend/validar_apk_ext.py --root app/src/main/assets/verified
          python backend/validar_apk_privada.py --root app/src/main/assets/verified
          python backend/validar_apk_cyl.py --root app/src/main/assets/verified
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK de Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar selector, favoritos, alertas y fichas
        run: python scripts/test_ui_080.py
      - name: Compilar y ejecutar todas las pruebas Android
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Preparar archivo para instalacion personal
        run: |
          set -eu
          cp app/build/outputs/apk/debug/app-debug.apk OpoAlert-Extremadura-1.18.0-PRUEBA.apk
          unzip -t OpoAlert-Extremadura-1.18.0-PRUEBA.apk >/dev/null
          unzip -Z1 OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep 'assets/verified/MD.json'
          unzip -Z1 OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep 'assets/verified/HB.json'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep "package: name='es.opoalert.app.ext'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep "OpoAlert EXT"
          unzip -Z1 OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep 'assets/verified/CY.json'
          unzip -Z1 OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep 'assets/verified/LN.json'
          unzip -Z1 OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep 'assets/verified/PL.json'
          unzip -Z1 OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep 'assets/verified/BD.json'
          unzip -Z1 OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep 'assets/verified/CC.json'
          unzip -Z1 OpoAlert-Extremadura-1.18.0-PRUEBA.apk | grep 'assets/verified/EX.json'
          sha256sum OpoAlert-Extremadura-1.18.0-PRUEBA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpoAlert-APK-EXTREMADURA-PRIVADA-1.18.0
          path: OpoAlert-Extremadura-1.18.0-PRUEBA.apk
          retention-days: 30
          if-no-files-found: error
