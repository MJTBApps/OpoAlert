name: OpoAlert - Analizar PDFs oficiales Salamanca y numeración
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [backend/probe_salamanca_documents.py, .github/workflows/probe-salamanca-documents.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4 pypdf
      - run: python -u backend/probe_salamanca_documents.py
