name: OpoAlert - Leer original PDF Segovia 117 y 129
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [backend/probe_segovia_issue_pdf.py, .github/workflows/probe-segovia-issue-pdf.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4 pypdf
      - run: python -u backend/probe_segovia_issue_pdf.py
