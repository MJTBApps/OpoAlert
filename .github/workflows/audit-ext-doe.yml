name: OpoAlert - Auditar DOE Extremadura 30 dias
on:
  push:
    branches: [feature/extremadura-tres-fuentes-20261029]
    paths: [backend/extremadura_doe.py, .github/workflows/audit-ext-doe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/extremadura_doe.py --output verified/extremadura_doe.json
      - uses: actions/upload-artifact@v4
        with:
          name: extremadura-doe-30dias
          path: verified/extremadura_doe.json
          retention-days: 15
          if-no-files-found: error
