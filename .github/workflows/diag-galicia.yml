name: OpoAlert - Diagnosticar cinco boletines Galicia
on:
  push:
    branches: [feature/galicia-cinco-boletines-20261029]
    paths: [backend/diag_galicia.py, .github/workflows/diag-galicia.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_galicia.py
