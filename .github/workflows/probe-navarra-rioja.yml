name: OpoAlert - Diagnostico Navarra y La Rioja
on:
  workflow_dispatch:
  push:
    branches: [feature/navarra-rioja-20261029]
    paths:
      - 'backend/probe_navarra_rioja.py'
      - '.github/workflows/probe-navarra-rioja.yml'
permissions: {contents: read}
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_navarra_rioja.py
