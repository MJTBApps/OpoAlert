name: OpoAlert España - Diagnóstico fuentes nacionales

on:
  workflow_dispatch:
  push:
    branches: [feature/espana-fase1]
    paths:
      - backend/diagnostico_espana.py
      - .github/workflows/probar-fuentes-espana.yml

permissions:
  contents: read

jobs:
  probar-fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar esquemas reales BOE y BOPT sin publicar
        run: python -u backend/diagnostico_espana.py
