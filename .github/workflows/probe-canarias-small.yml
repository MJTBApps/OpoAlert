name: OpoAlert - Índices provinciales Canarias resumidos
on:
  push:
    branches: [feature/canarias-3-boletines-20261029]
    paths: [backend/probe_canarias_small.py, .github/workflows/probe-canarias-small.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_canarias_small.py
