name: OpoAlert - Estructura BOME y accesos alternativos BOCCE
on:
  push:
    branches: [feature/ceuta-melilla-20261029]
    paths: [backend/diag_cm_deep.py, .github/workflows/diag-cm-deep.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_cm_deep.py
