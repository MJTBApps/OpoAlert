name: OpoAlert - Diagnosticar BORM Murcia
on:
  push:
    branches: [feature/murcia-borm-20261029]
    paths: [backend/diag_murcia_borm.py, .github/workflows/diag-murcia-borm.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_murcia_borm.py
