name: OpoAlert - Verificar estructura BOP Huesca
on:
  workflow_dispatch:
  push:
    branches: [feature/selector-ccaa-aragon-20261028]
    paths: [backend/probe_huesca_details.py, .github/workflows/probe-huesca-details.yml]
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: python -u backend/probe_huesca_details.py
