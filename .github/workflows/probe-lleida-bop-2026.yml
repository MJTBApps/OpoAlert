name: OpoAlert - Lleida BOP oficial 2026 acceso multired
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [backend/probe_lleida_bop_2026.py, .github/workflows/probe-lleida-bop-2026.yml]
permissions: {contents: read}
env: {PYTHONIOENCODING: utf-8}
jobs:
  first_party:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip -q install requests beautifulsoup4
      - run: python -u backend/probe_lleida_bop_2026.py
