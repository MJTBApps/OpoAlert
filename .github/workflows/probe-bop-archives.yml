name: OpoAlert - Inspeccionar BOP diarios Catalunya
on:
  workflow_dispatch:
  push:
    branches: [feature/bop-cataluna-restantes-20261028]
    paths:
      - backend/probe_bop_archives.py
      - .github/workflows/probe-bop-archives.yml
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: python -u backend/probe_bop_archives.py
