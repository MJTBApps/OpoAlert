name: OpoAlert - Verificar anuncios PDFs secciones BOIB
on:
  push:
    branches: [feature/baleares-boib-20261029]
    paths: [backend/diag_boib_sections.py, .github/workflows/diag-boib-sections.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_boib_sections.py
