name: OpoAlert - Diagnosticar búsqueda BOP Segovia septiembre
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [backend/cierre_segovia_form.py, .github/workflows/cierre-segovia-form.yml]
permissions: {contents: read}
jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/cierre_segovia_form.py
