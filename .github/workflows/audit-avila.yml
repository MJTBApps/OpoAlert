name: OpoAlert - Auditar BOP Avila 30 dias
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/avila_bop.py,backend/tests/test_avila_bop.py,.github/workflows/audit-avila.yml]
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s backend/tests -p test_avila_bop.py -v
      - run: python -u backend/avila_bop.py --output verified/avila_bop.json
      - uses: actions/upload-artifact@v4
        with:
          name: cyl-avila-bop-30dias
          path: verified/avila_bop.json
          if-no-files-found: error
          retention-days: 15
