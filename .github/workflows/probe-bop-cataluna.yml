name: OpoAlert - Diagnostico BOP Barcelona Girona Lleida
on:
  workflow_dispatch:
  push:
    branches: [feature/bop-cataluna-restantes-20261028]
    paths:
      - backend/probe_bop_cataluna_restantes.py
      - .github/workflows/probe-bop-cataluna.yml
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar tres portales oficiales sin publicar feeds
        run: python -u backend/probe_bop_cataluna_restantes.py
