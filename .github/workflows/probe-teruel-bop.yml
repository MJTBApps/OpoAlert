name: OpoAlert - Diagnosticar BOP Teruel
on:
  workflow_dispatch:
  push:
    branches: [feature/teruel-bop-audit-20261028]
    paths:
      - backend/probe_teruel_bop.py
      - .github/workflows/probe-teruel-bop.yml
permissions:
  contents: read
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: python -u backend/probe_teruel_bop.py
