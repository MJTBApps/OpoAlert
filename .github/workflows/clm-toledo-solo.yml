name: OpoAlert - Auditar Toledo 30 dias (sin publicar)
on:
  push:
    branches: [feature/castilla-la-mancha-completa-20261029]
    paths: [.github/workflows/clm-toledo-solo.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s backend/tests -p test_clm_sources.py -v
      - run: python -u backend/clm_toledo.py --output auditados/toledo_bop.json
      - uses: actions/upload-artifact@v4
        with:
          name: toledo-auditado-local
          path: auditados/toledo_bop.json
          retention-days: 7
