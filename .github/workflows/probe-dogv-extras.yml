name: OpoAlert - Comprobar DOGV especial y PDF originales
on:
  push:
    branches: [feature/cierre-pendientes-20261029]
    paths: [backend/probe_dogv_extras.py, .github/workflows/probe-dogv-extras.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -u backend/probe_dogv_extras.py
