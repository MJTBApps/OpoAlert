name: OpoAlert - Analizar BOP Alicante Castellon (rama desarrollo)

on:
  push:
    branches:
      - feature/comunitat-valenciana-1-0
    paths:
      - 'backend/probe_provinces.py'
      - '.github/workflows/probar-bop-provincias.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador y parser de pruebas
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Comprobar estructura oficial sin modificar el feed actual
        run: python -u backend/probe_provinces.py
      - name: Adjuntar HTML de paginas oficiales para revisar estructura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-bop-provincias
          path: backend/diag_sources/*.html
          if-no-files-found: warn
          retention-days: 1
