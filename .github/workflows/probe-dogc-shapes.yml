name: OpoAlert - DOGC verificar estructuras 30dias
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/probe_dogc_shapes.py
      - .github/workflows/probe-dogc-shapes.yml
permissions: {contents: read}
env: {PYTHONIOENCODING: utf-8}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip -q install requests
      - run: python -u backend/probe_dogc_shapes.py
