name: OpoAlert - Inspeccionar PDF oficiales Almería y Jaén
on:
  workflow_dispatch:
  push:
    branches: [feature/bop-almeria-jaen-20261029]
    paths: ['backend/probe_andalucia_pdf_index.py', '.github/workflows/probe-andalucia-pdf.yml']
permissions:
  contents: read
jobs:
  examinar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pypdf
      - run: python -u backend/probe_andalucia_pdf_index.py
