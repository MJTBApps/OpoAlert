name: OpoAlert - Cantabria BOC formulario y originales 2026
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/probe_cantabria_2026_editor.py
      - .github/workflows/probe-cantabria-2026-editor.yml
permissions: {contents: read}
env: {PYTHONIOENCODING: utf-8}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip -q install requests beautifulsoup4
      - run: python -u backend/probe_cantabria_2026_editor.py
