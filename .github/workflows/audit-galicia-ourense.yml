name: OpoAlert - Auditar BOP Ourense 30 dias
on:
  push:
    branches: [feature/galicia-cinco-boletines-20261029]
    paths: [backend/galicia_ourense.py, backend/galicia_common.py, .github/workflows/audit-galicia-ourense.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/galicia_ourense.py --output verified/galicia_ourense.json
      - uses: actions/upload-artifact@v4
        with:
          name: galicia-ourense-bop-30dias
          path: verified/galicia_ourense.json
          retention-days: 30
          if-no-files-found: error
