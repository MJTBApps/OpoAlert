name: OpoAlert - Conectividad BOP Burgos Salamanca Valladolid
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/diag_cyl_multi_os.py,.github/workflows/diag-cyl-networks.yml]
permissions: {contents: read}
jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,macos-latest,windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -u backend/diag_cyl_multi_os.py
