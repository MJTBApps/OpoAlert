name: OpoAlert - Alternativas oficiales BOC y BOPA
on:
  push:
    branches: [feature/pais-vasco-cantabria-asturias-20261029]
    paths: [backend/diag_norte_alt.py, .github/workflows/diag-norte-alt.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_norte_alt.py
