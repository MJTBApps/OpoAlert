name: OpoAlert - Diagnostico 12 zonas pendientes
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - 'backend/cierre_12_probe.py'
      - '.github/workflows/cierre-12-probe.yml'
permissions: {contents: read}
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/cierre_12_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: cierre-12-diagnostico-acceso
          path: out/cierre_12_probe.json
          retention-days: 14
          if-no-files-found: error
