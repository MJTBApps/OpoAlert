name: OpoAlert - Castilla y Leon diez fuentes oficiales
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths:
      - backend/diag_castilla_leon.py
      - .github/workflows/diag-castilla-leon.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_castilla_leon.py
