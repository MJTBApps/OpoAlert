name: OpoAlert - Probar hosts BOCM y descarga parcial
on:
  workflow_dispatch:
  push:
    branches: [feature/madrid-bocm-20261029]
    paths: [backend/diagnosticar_bocm_red.py,.github/workflows/diagnosticar-bocm-red.yml]
permissions: {contents: read}
jobs:
  examinar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u backend/diagnosticar_bocm_red.py
