name: OpoAlert - Navarra BON 30 dias auditoria offline
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/snapshots/NA_20261029.json.gz.b64
      - backend/validar_apk_navarra.py
      - .github/workflows/navarra-bon-30dias-auditar.yml
permissions: {contents: read}
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env: {PYTHONIOENCODING: utf-8}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Descomprimir y comprobar SHA de la captura privada original
        run: |
          python -m py_compile backend/validar_apk_navarra.py
          python -u backend/validar_apk_navarra.py --root out --decode
      - name: Verificar que no se publica la instantánea en ningún feed
        run: |
          test ! -e docs/navarra.json
          test ! -e navarra.json
      - name: Conservar solo instantánea validada para la APK privada
        uses: actions/upload-artifact@v4
        with:
          name: navarra-bon-auditado-30dias
          path: out/NA.json
          retention-days: 30
          if-no-files-found: error
