name: OpoAlert - DOGC parametros API oficial
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/probe_dogc_js_post.py
      - .github/workflows/probe-dogc-js-post.yml
permissions: {contents: read}
env: {PYTHONIOENCODING: utf-8}
jobs:
  inspect-js:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip -q install requests beautifulsoup4
      - run: python -u backend/probe_dogc_js_post.py
