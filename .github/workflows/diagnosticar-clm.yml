name: OpoAlert - Diagnosticar Castilla-La Mancha completa
on:
  workflow_dispatch:
  push:
    branches: [feature/castilla-la-mancha-completa-20261029]
    paths: [backend/diagnosticar_clm.py,.github/workflows/diagnosticar-clm.yml]
permissions: {contents: read}
jobs:
  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diagnosticar_clm.py
