name: OpoAlert - Revisar y publicar BOP Almeria
on:
  workflow_dispatch:
  schedule:
    # Cuatro veces al día: 6:30, 9:30, 12:30 y 16:30 en invierno (UTC+1);
    # una hora más tarde en verano. Escalonado para no coincidir con otras fuentes.
    - cron: '25 6 * * *'
    - cron: '25 9 * * *'
    - cron: '25 12 * * *'
    - cron: '25 16 * * *'
  push:
    branches: [main]
    paths:
      - 'backend/pandora_bop.py'
      - 'backend/validar_pandora_bop.py'
      - 'backend/tests/test_pandora_bop.py'
      - '.github/workflows/revisar-almeria.yml'
concurrency:
  group: opoalert-feed-almeria
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Tests lector BOP Almeria y correlacion sumario-PDF
        run: python -m unittest discover -s backend/tests -p test_pandora_bop.py -v
      - name: Auditar ultimos 30 dias y boletines consecutivos
        run: python -u backend/pandora_bop.py --province almeria --days 30 --output out_almeria/almeria_bop.json
      - name: Validacion independiente del historico
        run: python backend/validar_pandora_bop.py --province almeria --file out_almeria/almeria_bop.json --require-today
      - name: Publicar solo archivo auditado
        run: |
          set -eu
          cp out_almeria/almeria_bop.json docs/almeria_bop.json
          python backend/validar_pandora_bop.py --province almeria --file docs/almeria_bop.json --require-today
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/almeria_bop.json
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: BOP Almeria auditado 30 dias'
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "BOP Almeria actualizado"
                break
              fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Solicitar publicacion de los datos verificados
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
