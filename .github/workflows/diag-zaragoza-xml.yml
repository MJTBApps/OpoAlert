name: OpoAlert - Validar XML BOP Zaragoza por fecha
on:
  push:
    branches: [feature/zaragoza-bop-official-20261028]
    paths: ['backend/diag_zaragoza_xml.py', '.github/workflows/diag-zaragoza-xml.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u backend/diag_zaragoza_xml.py
