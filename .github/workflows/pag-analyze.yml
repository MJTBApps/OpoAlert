name: OpoAlert - Auditar XML PAG ambito nacional
on:
  push:
    branches: [feature/tarragona-spain-20261028]
    paths:
      - 'backend/pag_analyze.py'
      - '.github/workflows/pag-analyze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analizar XML original de ofertas estatales y autonomicas
        run: python -u backend/pag_analyze.py
