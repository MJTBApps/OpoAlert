name: OpoAlert - Verificar accesos desde varias redes
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/probe_hosts_runner.py,.github/workflows/probe-hosts-runner.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  redes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -u backend/probe_hosts_runner.py
