name: OpoAlert - Herramienta privada de diagnostico de acceso desde Windows
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - scripts/diagnostico_bop_local.py
      - .github/workflows/diagnostico-bop-local-windows.yml
permissions:
  contents: read
jobs:
  build-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar la logica sin usar Internet
        run: python scripts/diagnostico_bop_local.py --self-test
      - name: Empaquetar diagnostico portatil sin instalar Python
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --onefile --name OpoAlert-Diagnostico-Local scripts/diagnostico_bop_local.py
      - name: Verificar el ejecutable
        run: .\dist\OpoAlert-Diagnostico-Local.exe --self-test
      - name: Publicar herramienta de prueba privada
        uses: actions/upload-artifact@v4
        with:
          name: OpoAlert-Diagnostico-Local-Windows
          path: dist/OpoAlert-Diagnostico-Local.exe
          retention-days: 30
          if-no-files-found: error
