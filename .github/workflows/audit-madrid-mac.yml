name: OpoAlert - Madrid BOCM macOS 30 dias sin publicar
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [.github/workflows/audit-madrid-mac.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    runs-on: macos-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s backend/tests -p test_madrid_bocm.py -v
      - run: python -u backend/madrid_bocm.py --days 30 --output verified/madrid_bocm.json
      - run: python backend/validar_madrid_bocm.py --file verified/madrid_bocm.json --require-today
      - uses: actions/upload-artifact@v4
        with:
          name: madrid-bocm-verificado-solo-prueba
          path: verified/madrid_bocm.json
          retention-days: 15
          if-no-files-found: error
