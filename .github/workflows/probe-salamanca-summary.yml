name: OpoAlert - Verificar sumario e índice BOP Salamanca
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [backend/probe_salamanca_summary.py, .github/workflows/probe-salamanca-summary.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests pypdf
      - run: python -u backend/probe_salamanca_summary.py
