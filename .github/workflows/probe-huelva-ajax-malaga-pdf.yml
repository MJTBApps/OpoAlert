name: OpoAlert - Examinar AJAX Huelva y PDF Malaga
on:
  push:
    branches: [feature/rematar-clm-madrid-andalucia-20261029]
    paths: [backend/probe_huelva_ajax_malaga_pdf.py,.github/workflows/probe-huelva-ajax-malaga-pdf.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probar:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -u backend/probe_huelva_ajax_malaga_pdf.py
