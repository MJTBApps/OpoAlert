name: OpoAlert - Diagnosticar TLS BOP Ciudad Real
on:
  push:
    branches: [feature/castilla-la-mancha-completa-20261029]
    paths: [backend/diagnosticar_cr_tls.py,.github/workflows/diagnosticar-cr-tls.yml]
permissions: {contents: read}
jobs:
  certificados:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - run: python -u backend/diagnosticar_cr_tls.py
