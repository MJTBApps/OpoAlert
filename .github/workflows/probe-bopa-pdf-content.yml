name: OpoAlert - Asturias BOPA originales y manifest prueba
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/probe_bopa_pdf_content_2026.py
      - .github/workflows/probe-bopa-pdf-content.yml
permissions: {contents: read}
env: {PYTHONIOENCODING: utf-8}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip -q install requests pypdf
      - run: python -u backend/probe_bopa_pdf_content_2026.py
