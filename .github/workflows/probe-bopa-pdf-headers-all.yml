name: OpoAlert - BOPA revisar 53 cabeceras originales
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths:
      - backend/probe_bopa_pdf_headers_all.py
      - .github/workflows/probe-bopa-pdf-headers-all.yml
permissions: {contents: read}
env: {PYTHONIOENCODING: utf-8}
jobs:
  cabeceras:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip -q install requests pypdf
      - run: python -u backend/probe_bopa_pdf_headers_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asturias-bopa-cabeceras-53-auditoria
          path: out/BOPA_header_survey.json
          if-no-files-found: error
