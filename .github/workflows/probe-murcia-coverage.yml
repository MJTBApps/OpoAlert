name: OpoAlert - Contrastar BORM 30 dias
on:
  push:
    branches: [feature/murcia-borm-20261029]
    paths: [backend/probe_murcia_index_coverage.py, .github/workflows/probe-murcia-coverage.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_murcia_index_coverage.py
