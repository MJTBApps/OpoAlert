name: OpoAlert - Estructuras oficiales CLM
on:
  workflow_dispatch:
  push:
    branches: [feature/castilla-la-mancha-completa-20261029]
    paths: [backend/diagnosticar_clm_html.py,.github/workflows/diagnosticar-clm-html.yml]
permissions: {contents: read}
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diagnosticar_clm_html.py
