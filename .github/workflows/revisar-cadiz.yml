name: OpoAlert - Revisar y publicar BOP Cadiz
on:
  workflow_dispatch:
  schedule:
    # Dos veces al día: mañana y tarde (UTC; en España +1 h en invierno, +2 h en verano).
    - cron: '50 6 * * *'
    - cron: '50 14 * * *'
  push:
    branches: [main]
    paths:
      - backend/cadiz_bop.py
      - backend/validar_cadiz_bop.py
      - backend/tests/test_cadiz_bop.py
      - .github/workflows/revisar-cadiz.yml
concurrency:
  group: opoalert-feed-cadiz
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Pruebas y controles de anuncios oficiales
        run: python -m unittest discover -s backend/tests -p test_cadiz_bop.py -v
      - name: Auditar 30 dias, todas las ediciones y PDF
        run: python -u backend/cadiz_bop.py --days 30 --output out_cadiz/cadiz_bop.json
      - name: Validar antes de publicar historico
        run: python backend/validar_cadiz_bop.py --file out_cadiz/cadiz_bop.json --require-today
      - name: Actualizar fuente publica solo si todo es correcto
        run: |
          set -eu
          cp out_cadiz/cadiz_bop.json docs/cadiz_bop.json
          python backend/validar_cadiz_bop.py --file docs/cadiz_bop.json --require-today
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cadiz_bop.json
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: actualizar BOP Cadiz validado'
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'Datos Cadiz publicados'
                break
              fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Publicar datos en Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
