name: OpoAlert - Castilla Leon HTML selectores y datos BOCYL
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/diag_castilla_leon_dom.py,.github/workflows/diag-cyl-dom.yml]
permissions: {contents: read}
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_castilla_leon_dom.py
