name: OpoAlert - Identificar BOPZ numero 246
on:
  push:
    branches: [feature/zaragoza-bop-official-20261028]
    paths: ['backend/diag_zaragoza_issue246.py', '.github/workflows/diag-zaragoza-246.yml']
permissions:
  contents: read
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u backend/diag_zaragoza_issue246.py
