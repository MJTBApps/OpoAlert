name: OpoAlert - Publicar historico BOP auditado

on:
  workflow_dispatch:
  schedule:
    # Cuatro veces al día: 6:30, 9:30, 12:30 y 16:30 en invierno (UTC+1);
    # una hora más tarde en verano. Escalonado para no coincidir con otras fuentes.
    - cron: '35 5 * * *'
    - cron: '35 8 * * *'
    - cron: '35 11 * * *'
    - cron: '35 15 * * *'
  push:
    branches: [main]
    paths:
      - 'backend/idioma_bop.py'
      - 'backend/bop_full.py'
      - 'backend/history.py'
      - 'backend/scan.py'
      - '.github/workflows/revisar-bop.yml'

concurrency:
  group: opoalert-feed
  cancel-in-progress: false

jobs:
  leer-y-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - name: Obtener OpoAlert
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector Chromium
        run: |
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Ejecutar pruebas antes de consultar el BOP
        # Solo las del BOP de Valencia: un fallo en otra fuente no debe parar este feed.
        working-directory: backend/tests
        run: python -m unittest -q test_bop_full test_datagrid_real_050 test_historico_049 test_history test_originales_048 test_history_ajax_045 test_calendar_047 test_history_click_043 test_history_calendar_042 test_history_click_044 test_publication_calendar_052 test_history_dates_041 test_validar_feed_060 test_idioma_bop_081 test_scan
      - name: Leer y auditar el ultimo boletin
        run: python -u backend/bop_full.py --output data/convocatorias.json
      - name: Leer los 30 dias completos mediante calendario oficial
        run: python -u backend/history.py --days 30 --window-days 5 --output data/convocatorias.json
      - name: Validar ventanas fechas paginacion y enlaces
        run: python backend/validar_feed.py --input data/convocatorias.json --require-today --max-age-hours 3
      - name: Preparar archivo publico SOLO con historico auditado
        run: python backend/publicar_feed.py --input data/convocatorias.json --output docs/convocatorias.json --require-history
      - name: Verificar el archivo antes de publicar
        run: python backend/validar_feed.py --input docs/convocatorias.json --require-today --max-age-hours 3
      - name: Guardar feed confirmado en el repositorio
        run: |
          git config user.name 'OpoAlert Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/convocatorias.json
          if ! git diff --cached --quiet; then
            git commit -m 'OpoAlert: actualizar 30 dias de BOP auditados'
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "BOP Valencia actualizado"
                break
              fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          else
            echo 'El feed ya estaba actualizado.'
          fi
      - name: Diagnosticos si falla (sin exponer publicamente)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-bop
          path: |
            backend/diagnostico_bop.png
            backend/diagnostico_historico.png
            backend/diagnostico_historico.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Solicitar publicacion unica de los feeds verificados
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-web.yml --ref main
