name: OpoAlert - Estructura JSON Ourense BOP
on:
  push:
    branches: [feature/galicia-cinco-boletines-20261029]
    paths: [backend/ourense_schema.py, .github/workflows/ourense-schema.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -u backend/ourense_schema.py
