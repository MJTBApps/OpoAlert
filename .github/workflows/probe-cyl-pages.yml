name: OpoAlert - Paginacion Zamora Soria Segovia
on:
  push:
    branches: [feature/castilla-y-leon-9-provincias-20261029]
    paths: [backend/probe_cyl_pages.py,.github/workflows/probe-cyl-pages.yml]
permissions: {contents: read}
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/probe_cyl_pages.py
