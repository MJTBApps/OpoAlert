name: OpoAlert - Activar publicacion APK 1.10
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/solicitar-apk-110.yml']
permissions:
  contents: read
  actions: write
jobs:
  solicitar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Lanzar publicacion APK auditada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-apk-pages.yml --ref main
