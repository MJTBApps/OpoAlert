name: OpoAlert - Reparar cadena HTTPS Ciudad Real
on:
  push:
    branches: [feature/castilla-la-mancha-completa-20261029]
    paths: [backend/diagnosticar_cr_ca.py,.github/workflows/diagnosticar-cr-ca.yml]
permissions: {contents: read}
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests certifi cryptography
      - run: python -u backend/diagnosticar_cr_ca.py
