name: OpoAlert - Auditoria Málaga BOP 30 dias oficial
on:
  workflow_dispatch:
  push:
    branches: [feature/cierre-12-zonas-20261029]
    paths: [.github/workflows/cierre-malaga-audit.yml]
permissions: {contents: read}
jobs:
  inspeccion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python -m py_compile backend/malaga_bop.py
      - run: python -u backend/malaga_bop.py --output out/MA.json
      - uses: actions/upload-artifact@v4
        with:
          name: malaga-30dias-${{ matrix.os }}
          path: out/MA.json
          retention-days: 30
          if-no-files-found: error
