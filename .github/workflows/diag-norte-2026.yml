name: OpoAlert - Explorar PV Cantabria Asturias 6 boletines
on:
  push:
    branches: [feature/pais-vasco-cantabria-asturias-20261029]
    paths: [backend/diag_norte_2026.py, .github/workflows/diag-norte-2026.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python -u backend/diag_norte_2026.py
