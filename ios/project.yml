# Proyecto de Xcode de la app iOS. No se sube el .xcodeproj: se genera con
# XcodeGen (`brew install xcodegen`, y en esta carpeta `xcodegen generate`).
name: OpoAlert
options:
  bundleIdPrefix: es.opoalert
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: es
packages:
  OpoAlertCore:
    path: OpoAlertCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.53.1"  # mismo número que Android
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # AdMob: identificadores de PRUEBA de Google. Los reales solo se pasan al compilar
    # la versión del App Store (GitHub Actions, secretos); nunca en el repositorio.
    ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
    ADMOB_BANNER: "ca-app-pub-3940256099942544/2435281174"
    ADMOB_OPEN_AD: "ca-app-pub-3940256099942544/5575463023"
targets:
  OpoAlert:
    type: application
    platform: iOS
    sources:
      - path: OpoAlert
    dependencies:
      - package: OpoAlertCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.opoalert.app
        PRODUCT_NAME: OpoAlert
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpoAlert
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: OpoAlert/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        UIBackgroundModes: [fetch]
        # Los colores son los de Android (tema claro): sin modo oscuro.
        UIUserInterfaceStyle: Light
        BGTaskSchedulerPermittedIdentifiers: [es.opoalert.app.refresh]
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        OpoAdmobBanner: $(ADMOB_BANNER)
        OpoAdmobOpenAd: $(ADMOB_OPEN_AD)
        # Texto del aviso de Apple «¿Permitir que OpoAlert rastree tu actividad…?».
        NSUserTrackingUsageDescription: "Se usa solo para mostrarte anuncios más relevantes. OpoAlert funciona igual si no lo permites."
        # Red de anuncios de Google (SKAdNetwork), obligatorio para los anuncios en iOS.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
schemes:
  OpoAlert:
    build:
      targets:
        OpoAlert: all
