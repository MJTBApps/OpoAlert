# Proyecto de Xcode de la app iOS. No se sube el .xcodeproj: se genera con
# XcodeGen (`brew install xcodegen`, y en esta carpeta `xcodegen generate`).
name: OpoAlert
options:
  bundleIdPrefix: es.opoalert
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: es
packages:
  OpoAlertCore:
    path: OpoAlertCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  OpoAlert:
    type: application
    platform: iOS
    sources:
      - path: OpoAlert
    dependencies:
      - package: OpoAlertCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.opoalert.app
        PRODUCT_NAME: OpoAlert
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpoAlert
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: OpoAlert/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [es.opoalert.app.refresh]
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
schemes:
  OpoAlert:
    build:
      targets:
        OpoAlert: all
